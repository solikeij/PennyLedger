<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2A835F" />
    <title>PennyLedger</title>
    <script>
      try {
        const theme =
          new URLSearchParams(location.search).get("theme") ||
          localStorage.getItem("pennyledger_theme");
        document.documentElement.dataset.theme =
          theme === "dark" ? "dark" : "light";
      } catch {
        /* Storage is optional. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
